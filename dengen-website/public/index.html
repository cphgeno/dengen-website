<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <link rel="icon" href="https://www.rigshospitalet.dk/SiteCollectionImages/favicon.ico" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#000000" />
    <meta
      name="description"
      content="Web site created using create-react-app"
    />
    <link rel="apple-touch-icon" href="https://upload.wikimedia.org/wikipedia/commons/thumb/3/37/Rigshospitalet_logo.svg/800px-Rigshospitalet_logo.svg.png?20171103201311" />
    <!--
      manifest.json provides metadata used when your web app is installed on a
      user's mobile device or desktop. See https://developers.google.com/web/fundamentals/web-app-manifest/
    -->
    <link rel="manifest" href="%PUBLIC_URL%/manifest.json" />
    <!--
      Notice the use of %PUBLIC_URL% in the tags above.
      It will be replaced with the URL of the `public` folder during the build.
      Only files inside the `public` folder can be referenced from the HTML.

      Unlike "/favicon.ico" or "favicon.ico", "%PUBLIC_URL%/favicon.ico" will
      work correctly both with client-side routing and a non-root public URL.
      Learn how to configure a non-root public URL by running `npm run build`.
    -->
    <title>DenGen</title>

    <!-- Bioschemas / JSON-LD -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "Organization",
      "@id": "https://dengen.dk/#organization",
      "name": "DenGen",
      "url": "https://dengen.dk",
      "description": "Danish population genome variation resource maintained by MDxCORE at Rigshospitalet."
    }
    </script>

    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "DataCatalog",
      "@id": "https://dengen.dk/#catalog",
      "name": "DenGen",
      "url": "https://dengen.dk",
      "description": "Catalog of Danish population genomic variation datasets.",
      "provider": { "@id": "https://dengen.dk/#organization" },
      "keywords": ["genomics", "whole genome sequencing", "Denmark", "variant frequencies", "population genetics"]
    }
    </script>

    <script type="application/ld+json">
{
  "@context": "https://schema.org",
  "@type": "Dataset",
  "@id": "https://dengen.dk/#dataset",
  "name": "DenGen Danish Population Variant Dataset",
  "description": "Aggregated frequencies of single nucleotide variants and structural variants from 2,211 unrelated Danish whole genome sequencing samples.",
  "url": "https://dengen.dk",
  "includedInDataCatalog": { "@id": "https://dengen.dk/#catalog" },
  "creator": { "@id": "https://dengen.dk/#organization" },
  "keywords": ["DenGen", "Denmark", "whole genome sequencing", "SNV", "structural variants", "allele frequency", "Homo sapiens", "human"],
  "measurementTechnique": ["Whole genome sequencing", "Variant calling"],
  "variableMeasured": [
    { "@type": "PropertyValue", "name": "Allele Frequency" },
    { "@type": "PropertyValue", "name": "Structural Variant Frequency" }
  ]
}
</script>

    <!-- Google tag (gtag.js) -->
    <script async src="https://www.googletagmanager.com/gtag/js?id=G-0EYMEP67W8"></script>
    <script>
      window.dataLayer = window.dataLayer || [];
      function gtag(){ dataLayer.push(arguments); }
      gtag('js', new Date());
      gtag('config', 'G-0EYMEP67W8', {
        send_page_view: false
      });
    </script>


  </head>
  <body>
    <noscript>You need to enable JavaScript to run this app.</noscript>
    <div id="root"></div>

</html>
